<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios con Node</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <header>
        <h1>Ejercicios con Node</h1>
    </header>
    <main>
        <section class="ejercicio">
            <h2 id="titulo-arreglos">Arreglos del código <code>01-arreglos.js</code></h2>
            <p>Datos de prueba con JS</p>

            <div class="tabla-scroll">
                <table id="tabla-talleres">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Instructor</th>
                            <th>Cupo</th>
                            <th>Inscritos</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>

            <form id="form-arreglos" class="formulario">
                <div class="campos">
                    <label for="operacion-arreglo">Operación</label>
                    <select name="operacion-arreglo" id="operacion-arreglo">
                        <option value="forEach">forEach - Lista simple</option>
                        <option value="map">map - Copia solo nombres</option>
                        <option value="filter">filter - Talleres con cupo lleno</option>
                        <option value="find">find - Primer taller de Ing. María López</option>
                        <option value="reduce">reduce - Total de inscritos</option>
                        <option value="filtermap">filter + map - Talleres con cupo disponible</option>
                    </select>
                </div>

                <button type="submit">Ejecutar</button>
            </form>

            <output class="resultado" id="resultado-arreglo" for="form-arreglos"></output>
        </section>
    </main>

<script src="../JS/app.js"></script>
</body>
</html>
